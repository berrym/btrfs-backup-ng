# Continuous Integration workflow for btrfs-backup-ng
# Runs on every push and pull request to ensure code quality

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # The remote-command tests run every lock script through a real csh and
      # tcsh login shell; here, a missing one fails them instead of skipping.
      BBNG_REQUIRE_LOGIN_SHELLS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install login shells the remote-command tests run under
        run: |
          sudo apt-get update
          sudo apt-get install -y tcsh
          command -v dash && command -v tcsh && command -v csh

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      # The exact versions in uv.lock, the ones every local run uses. An
      # unpinned install took whatever was newest, so CI and a developer's
      # machine could run different pytest releases and disagree.
      - name: Install dependencies
        run: |
          uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        run: |
          uv run --frozen pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          uv run --frozen pytest tests/ --cov=src/btrfs_backup_ng --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --python 3.12

      - name: Run Ruff linter
        run: |
          uv run --frozen ruff check src/ tests/

      - name: Run Ruff formatter check
        run: |
          uv run --frozen ruff format --check src/ tests/

      - name: Run mypy type checker
        run: |
          uv run --frozen mypy src/btrfs_backup_ng --ignore-missing-imports

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
