[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the man pages and shell completions in the wheel, not only the sdist.
# MANIFEST.in governs the source tarball alone, so `pip install btrfs-backup-ng`
# delivered neither, and `manpages install` / `completions install` had nothing to
# copy from. Installed under the environment prefix on the standard FHS paths, which
# is where get_manpages_dir()/get_completions_dir() look. The top-level directories
# stay put so distribution packaging can keep referencing them directly.
[tool.setuptools.data-files]
"share/man/man1" = ["man/man1/*.1"]
"share/btrfs-backup-ng/completions" = [
    "completions/btrfs-backup-ng.bash",
    "completions/btrfs-backup-ng.zsh",
    "completions/btrfs-backup-ng.fish",
]

[project]
name = "btrfs-backup-ng"
version = "0.9.6"
description = "Complete btrfs backup solution with automated snapshots, incremental transfers, restore functionality, snapper integration, and systemd scheduling"
authors = [{ name = "Michael Berry", email = "trismegustis@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["filelock", "rich"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    # Pin below 0.16: ruff 0.16.0 enabled new/changed lint+format rules that flag ~1000
    # pre-existing findings repo-wide. Adopting 0.16 is a deliberate follow-up (folds into the
    # 0.9.0 reliability audit); until then, stay on the 0.15 line the codebase is clean against.
    "ruff>=0.15.0,<0.16.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/berrym/btrfs-backup-ng"

[project.scripts]
btrfs-backup-ng = "btrfs_backup_ng.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not tier2'"
asyncio_mode = "auto"
markers = [
    "tier2: Tier 2 integration tests requiring real btrfs and root privileges",
]

[tool.coverage.run]
source = ["src/btrfs_backup_ng"]
branch = true
omit = [
    # Integration-only modules requiring actual btrfs operations
    "src/btrfs_backup_ng/_legacy_main.py",
    "src/btrfs_backup_ng/__main__.py",
    "src/btrfs_backup_ng/endpoint/common.py",
    "src/btrfs_backup_ng/endpoint/local.py",
    "src/btrfs_backup_ng/endpoint/shell.py",
    "src/btrfs_backup_ng/endpoint/ssh.py",
    "src/btrfs_backup_ng/ssh_transfer.py",
    "src/btrfs_backup_ng/sshutil/*",
    # CLI subcommand implementations (require config + btrfs)
    "src/btrfs_backup_ng/cli/run.py",
    "src/btrfs_backup_ng/cli/snapshot.py",
    "src/btrfs_backup_ng/cli/transfer.py",
    "src/btrfs_backup_ng/cli/prune.py",
    "src/btrfs_backup_ng/cli/list_cmd.py",
    "src/btrfs_backup_ng/cli/status.py",
    "src/btrfs_backup_ng/cli/config_cmd.py",
    "src/btrfs_backup_ng/cli/install.py",
    # Core execution requiring actual btrfs
    "src/btrfs_backup_ng/core/operations.py",
    "src/btrfs_backup_ng/core/execution.py",
    "src/btrfs_backup_ng/core/planning.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# Current coverage ~56% for testable code (many modules require real btrfs)
# Goal: increase to 70%+ as we add more unit tests with mocking
fail_under = 55

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
# A `type: ignore` that no longer silences anything is worse than none: it reads
# as "there is a typing problem here" when there is not, and it will swallow a
# REAL error appearing on that line later. 42 of the 46 in the tree were dead
# when this was turned on, most outliving the .pyi stubs that caused them.
warn_unused_ignores = true
ignore_missing_imports = true
exclude = [
    "tests/",
]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false
exclude = [
    "**/tests/**",
]
